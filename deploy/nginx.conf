upstream bmcl_mirror {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name mirror.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mirror.example.com;

    ssl_certificate     /etc/letsencrypt/live/mirror.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.com/privkey.pem;

    client_max_body_size 8m;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://bmcl_mirror;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    location /_stats {
        proxy_pass http://bmcl_mirror;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        deny all;
    }

    location /_purge {
        proxy_pass http://bmcl_mirror;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        deny all;
    }

    access_log off;
    error_log /var/log/nginx/bmcl-mirror.error.log warn;
}